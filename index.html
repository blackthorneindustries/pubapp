<html lang="en">

    <style>
        /* Modern Tech Font - Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            /* EXACT FLUTTERFLOW DARK MODE PALETTE */
            --primary-gold: #b69a5e; 
            --secondary-burgundy: #5e1e1e;
            --tertiary-rust: #8b4e28;
            --alternate-dark: #3a2323;
            
            --bg-deep: #181414; 
            --bg-card: #2a1b1b; 
            
            --text-primary: #e5cdaf; 
            --text-secondary: #c7b49c; 
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(182, 154, 94, 0.15); 
            background: rgba(24, 20, 20, 0.95);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .company-name {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .beta-tag {
            color: var(--primary-gold);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .hero {
            padding: 80px 20px 60px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-gold);
            font-size: 5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -3px;
        }

        .sub-head {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 50px;
        }

        .founder-card {
            background: linear-gradient(145deg, var(--alternate-dark) 0%, rgba(58, 35, 35, 0.4) 100%);
            border: 1px solid rgba(182, 154, 94, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .founder-card::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 40px;
            background: var(--primary-gold);
            filter: blur(30px);
            opacity: 0.15;
            z-index: -1;
        }

        .founder-card h3 {
            color: var(--primary-gold);
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .founder-card p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="email"] {
            width: 100%;
            padding: 18px;
            background: rgba(229, 205, 175, 0.05);
            border: 1px solid rgba(229, 205, 175, 0.15);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="email"]::placeholder {
            color: rgba(199, 180, 156, 0.5);
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(229, 205, 175, 0.08);
            box-shadow: 0 0 0 4px rgba(182, 154, 94, 0.15);
        }

        .cta-button {
            background-color: var(--primary-gold);
            color: #120e0e; 
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            width: 100%;
        }

        .cta-button:hover {
            background-color: #cbb47e; 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(182, 154, 94, 0.25);
        }
